<style>
*{box-sizing:border-box}
body{

header{text-align:center;padding:35px 15px 20px}
header h1{font-size:38px;margin:0;color:#8c7cff;text-shadow:0 0 20px #6554ff}

.controls{max-width:1100px;margin:15px auto;padding:0 15px;display:flex;gap:10px;flex-wrap:wrap}
input,select{background:#151b31;color:white;border:1px solid #343c61;padding:13px;border-radius:10px;font-size:15px;outline:none}

#games{max-width:1100px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}

.cover{height:125px;background:linear-gradient(135deg,#242052,#17416b);display:flex;align-items:center;justify-content:center;overflow:hidden}

.cover span{font-size:48px}
.info{padding:13px}
.info h3{margin:0 0 9px;font-size:18px}
.tag{font-size:12px;color:#a9a4ff;background:#28234b;padding:5px 8px;border-radius:7px;display:inline-block}
.platform{font-size:12px;color:#9da8c7;margin-left:5px}
.card p{font-size:13px;color:#aab2c9;margin-bottom:0}
#modal{display:none;position:fixed;inset:0;background:#000c;z-index:10;overflow:auto;padding:20px}
.modalbox{max-width:650px;margin:30px auto;background:#141a30;border:1px solid #454b78;border-radius:18px;padding:22px;position:relative}
.close{position:absolute;right:17px;top:13px;border:0;background:#302d55;color:white;padding:9px 13px;border-radius:8px;cursor:pointer}
#detailImage{width:100%;height:190px;object-fit:cover;border-radius:12px;background:#25234c}
#detailEmoji{font-size:60px;text-align:center;margin:10px}
.modalbox h2{color:#a99cff}
.modalbox p{color:#d0d5e8;line-height:1.6}
.download{display:inline-block;background:#6c58e8;color:white;text-decoration:none;padding:12px 17px;border-radius:9px;margin:10px 0}
textarea{width:100%;min-height:75px;background:#0c1225;color:white;border:1px solid #343c61;border-radius:10px;padding:12px;resize:vertical}
button{cursor:pointer}
#send{background:#6c58e8;color:white;border:0;padding:10px 16px;border-radius:8px;margin-top:8px}
.comment{background:#202844;padding:10px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}
footer{text-align:center;color:#7883a5;padding:30px}
.empty{text-align:center;color:#aab2c9;grid-column:1/-1}
</style>

function imageUrl(g){
 if(g.image)return g.image;
 if(g.app)return "https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/"+g.app+"/header.jpg";
 return "";
}

function showGames(){
 const q=document.getElementById("search").value.toLowerCase();
 const p=document.getElementById("platform").value;
 const genre=document.getElementById("genre").value;
 const box=document.getElementById("games");
 box.innerHTML="";
 const filtered=games.filter(g=>g.name.toLowerCase().includes(q)&&(p==="Hepsi"||g.platform===p)&&(genre==="Hepsi"||g.genre===genre));
 if(!filtered.length){box.innerHTML='<div class="empty">Oyun bulunamadı 😕</div>';return;}
 filtered.forEach(g=>{
  const card=document.createElement("div");card.className="card";
  const cover=document.createElement("div");cover.className="cover";
  const emoji=document.createElement("span");emoji.textContent=g.emoji;
  cover.appendChild(emoji);
  const src=imageUrl(g);
  if(src){
   const img=document.createElement("img");
   img.alt=g.name+" kapak resmi";
   img.src=src;
   img.onload=()=>{emoji.style.display="none";};
   img.onerror=()=>{img.remove();emoji.style.display="inline";};
   cover.appendChild(img);
  }
  const info=document.createElement("div");info.className="info";
  const h=document.createElement("h3");h.textContent=g.name;
  const tag=document.createElement("span");tag.className="tag";tag.textContent=g.genre;
  const platform=document.createElement("span");platform.className="platform";platform.textContent=g.platform;
  const desc=document.createElement("p");desc.textContent=g.desc;
  info.append(h,tag,platform,desc);card.append(cover,info);
  card.onclick=()=>openModal(g);box.appendChild(card);
 });
}

function openModal(g){
 document.getElementById("modal").style.display="block";
 document.getElementById("detailName").textContent=g.name;
 document.getElementById("detailTags").textContent=g.platform+" • "+g.genre;
 document.getElementById("detailDescription").textContent=g.desc;
 document.getElementById("detailSize").textContent=g.size;
 document.getElementById("detailHow").textContent=g.how;
 document.getElementById("detailEmoji").textContent=g.emoji;
 const img=document.getElementById("detailImage");
 const src=imageUrl(g);
 img.style.display="none";
 if(src){
  img.onload=()=>{img.style.display="block";document.getElementById("detailEmoji").style.display="none";};
  img.onerror=()=>{img.style.display="none";document.getElementById("detailEmoji").style.display="block";};
  img.src=src;
 }else{
  document.getElementById("detailEmoji").style.display="block";
 }
 document.getElementById("download").href=g.url;
 window.selectedGame=g.name;
 document.getElementById("commentInput").value="";
 showComments();
}
function closeModal(){document.getElementById("modal").style.display="none";}
function showComments(){
 const box=document.getElementById("comments");box.innerHTML="";
 const data=JSON.parse(localStorage.getItem("oyunYorumlari")||"{}");
 const list=data[window.selectedGame]||[];
 if(!list.length)box.innerHTML='<p style="color:#8994b5">Henüz yorum yok. İlk yorumu sen yaz!</p>';
 list.forEach(c=>{const d=document.createElement("div");d.className="comment";d.textContent="💬 "+c;box.appendChild(d);});
}
function addComment(){
 const input=document.getElementById("commentInput");
 const value=input.value.trim();if(!value)return;
 const data=JSON.parse(localStorage.getItem("oyunYorumlari")||"{}");
 if(!data[window.selectedGame])data[window.selectedGame]=[];
 data[window.selectedGame].push(value);
 localStorage.setItem("oyunYorumlari",JSON.stringify(data));
 input.value="";showComments();
}
document.getElementById("search").addEventListener("input",showGames);
document.getElementById("platform").addEventListener("change",showGames);
document.getElementById("genre").addEventListener("change",showGames);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
showGames();
</script>
