let selectedGame=null;

function renderGames(){
 const query=document.getElementById("search").value.trim().toLocaleLowerCase("tr");
 const platform=document.getElementById("platform").value;
 const genre=document.getElementById("genre").value;
 const box=document.getElementById("games");
 box.innerHTML="";

 const filtered=games.filter(g=>
  g.name.toLocaleLowerCase("tr").includes(query) &&
  (platform==="Hepsi" || g.platform===platform || (platform==="PC" && g.platform==="PC ve Mobil") || (platform==="Mobil" && g.platform==="PC ve Mobil")) &&
  (genre==="Hepsi" || g.genre===genre)
 );

 if(!filtered.length){
  box.innerHTML='<div class="empty">Aradığın oyun bulunamadı. 😕</div>';
  return;
 }

 filtered.forEach(g=>{
  const card=document.createElement("article");
  card.className="card";
  const cover=document.createElement("div");
  cover.className="cover";
  cover.textContent=g.emoji;
  const info=document.createElement("div");
  info.className="info";
  const h=document.createElement("h3");
  h.textContent=g.name;
  const tag=document.createElement("span");
  tag.className="tag";
  tag.textContent=g.genre;
  const plat=document.createElement("span");
  plat.className="platform";
  plat.textContent=g.platform;
  const p=document.createElement("p");
  p.textContent=g.description.slice(0,125)+"...";
  info.append(h,tag,plat,p);
  card.append(cover,info);
  card.addEventListener("click",()=>openModal(g));
  box.appendChild(card);
 });
}

function openModal(g){
 selectedGame=g.name;
 document.getElementById("detailEmoji").textContent=g.emoji;
 document.getElementById("detailName").textContent=g.name;
 document.getElementById("detailMeta").textContent=
  "Tür: "+g.genre+" • Platform: "+g.platform+" • Geliştirici: "+g.developer+" • Çıkış: "+g.year+" • Oynanış: "+g.mode;
 document.getElementById("detailDescription").textContent=g.description;
 document.getElementById("detailHow").textContent=g.how;
 document.getElementById("detailTechnical").textContent=g.technical+"\nKurulum boyutu: "+g.size;
 const link=document.getElementById("download");
 link.href=g.url;
 document.getElementById("commentInput").value="";
 showComments();
 document.getElementById("modal").style.display="block";
 document.body.style.overflow="hidden";
}

function closeModal(){
 document.getElementById("modal").style.display="none";
 document.body.style.overflow="";
 selectedGame=null;
}

function readComments(){
 try{return JSON.parse(localStorage.getItem("oyunRehberiYorumlari")||"{}")}
 catch(e){return {}}
}

function showComments(){
 const box=document.getElementById("comments");
 box.innerHTML="";
 const data=readComments();
 const list=data[selectedGame]||[];
 if(!list.length){
  const p=document.createElement("p");
  p.className="meta";
  p.textContent="Henüz yorum yok. İlk yorumu sen yaz!";
  box.appendChild(p);
  return;
 }
 list.forEach(comment=>{
  const div=document.createElement("div");
  div.className="comment";
  div.textContent="💬 "+comment;
  box.appendChild(div);
 });
}

function addComment(){
 const input=document.getElementById("commentInput");
 const value=input.value.trim();
 if(!value || !selectedGame)return;
 const data=readComments();
 if(!Array.isArray(data[selectedGame]))data[selectedGame]=[];
 data[selectedGame].push(value.slice(0,500));
 try{
  localStorage.setItem("oyunRehberiYorumlari",JSON.stringify(data));
  input.value="";
  showComments();
 }catch(e){
  alert("Yorum kaydedilemedi. Tarayıcı depolama alanını kontrol et.");
 }
}

document.getElementById("search").addEventListener("input",renderGames);
document.getElementById("platform").addEventListener("change",renderGames);
document.getElementById("genre").addEventListener("change",renderGames);
document.getElementById("modal").addEventListener("click",e=>{
 if(e.target.id==="modal")closeModal();
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeModal();
});

renderGames();
</script>
</body>
