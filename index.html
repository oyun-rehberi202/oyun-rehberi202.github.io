const grid=document.getElementById("games");
const search=document.getElementById("search");
const count=document.getElementById("count");
const empty=document.getElementById("empty");
let activeFilter="Hepsi";

function render(){
 const term=search.value.toLocaleLowerCase("tr");
 const filtered=games.filter(g=>
  (activeFilter==="Hepsi"||g[1]===activeFilter)&&
  (g[0].toLocaleLowerCase("tr").includes(term)||g[1].toLocaleLowerCase("tr").includes(term))
 );
 grid.innerHTML="";
 count.textContent=filtered.length+" / "+games.length+" OYUN";
 empty.style.display=filtered.length?"none":"block";
 filtered.forEach((g)=>{
  const card=document.createElement("article");
  card.className="card";
  card.innerHTML=`
   <div class="cover"><span class="emoji">${g[3]}</span></div>
   <div class="cardbody">
    <h3>${g[0]}</h3>
    <div class="meta">${g[2]} · ${g[4]}</div>
    <span class="tag">${g[1]}</span>
   </div>`;
  card.addEventListener("click",()=>openGame(g,card));
  grid.appendChild(card);
  loadCover(g,card.querySelector(".cover"));
 });
}

const coverCache={};
async function loadCover(g,element){
 const title=g[0];
 if(coverCache[title]===null)return;
 if(coverCache[title]){
  element.innerHTML=`<img loading="lazy" src="${coverCache[title]}" alt="${title} kapak görseli">`;
  return;
 }
 try{
  const url="https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(title)+"&gsrnamespace=0&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json&origin=*";
  const response=await fetch(url);
  const data=await response.json();
  const pages=data.query?.pages;
  const page=pages?Object.values(pages)[0]:null;
  const image=page?.thumbnail?.source;
  if(image){
   coverCache[title]=image;
   if(element.isConnected)element.innerHTML=`<img loading="lazy" src="${image}" alt="${title} kapak görseli">`;
  }else coverCache[title]=null;
 }catch(error){coverCache[title]=null;}
}

function openGame(g,card){
 const modal=document.getElementById("modal");
 document.getElementById("modalname").textContent=g[0];
 document.getElementById("modalmeta").textContent=g[1]+" · "+g[2]+" · "+g[4];
 document.getElementById("modaldesc").textContent=g[6];
 document.getElementById("modalinfo").innerHTML=
  "<b>Tür:</b> "+g[1]+"<br><b>Platform:</b> "+g[2]+"<br><b>Çıkış yılı:</b> "+g[4]+"<br><b>Oyun sayısı:</b> "+games.length;
 const cover=document.getElementById("modalcover");
 cover.innerHTML="<span>"+g[3]+"</span>";
 if(coverCache[g[0]])cover.innerHTML=`<img src="${coverCache[g[0]]}" alt="${g[0]}">`;
 document.getElementById("play").href=g[5];
 modal.classList.add("show");
}
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").addEventListener("click",e=>{
 if(e.target.id==="modal")e.currentTarget.classList.remove("show");
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")document.getElementById("modal").classList.remove("show");
});
search.addEventListener("input",render);
document.getElementById("filters").addEventListener("click",e=>{
 if(e.target.tagName!=="BUTTON")return;
 document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
 e.target.classList.add("active");
 activeFilter=e.target.dataset.filter;
 render();
});
render();
</script>
