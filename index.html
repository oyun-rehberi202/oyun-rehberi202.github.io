*{box-sizing:border-box}
:root{color-scheme:dark}
body{

header{text-align:center;padding:35px 15px 20px}

  margin:0;
  color:#a99cff;
  font-size:clamp(28px,5vw,40px);
  text-shadow:0 0 20px #6554ff;
}
header p{color:#aab2d1;margin:10px 0 0}
.controls{
  max-width:1100px;
  margin:15px auto;
  padding:0 15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
input,select,textarea{
  background:#151b31;
  color:#fff;
  border:1px solid #343c61;
  border-radius:10px;
  font:inherit;
  outline:none;
}
input,select{padding:13px;font-size:15px}
input:focus,select:focus,textarea:focus{border-color:#8c7cff;box-shadow:0 0 0 3px #6554ff25}
#search{flex:1;min-width:190px}
select{min-width:145px}
#games{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:18px;
}
.card{
  background:#151b31;
  border:1px solid #293253;
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.card:hover{
  transform:translateY(-5px);
  border-color:#8878ff;
  box-shadow:0 10px 30px #6554ff35;
}
.card:focus-visible{outline:2px solid #a99cff;outline-offset:3px}
.cover{
  height:132px;
  position:relative;
  background:linear-gradient(135deg,#242052,#17416b);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.cover img{
  display:none;
  width:100%;
  height:100%;
  object-fit:cover;
}
.cover-placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  font-size:52px;
  background:
    radial-gradient(circle at 25% 25%,#5145a5 0,transparent 40%),
    linear-gradient(135deg,#242052,#17416b);
}
.cover-fallback-label{
  position:absolute;
  bottom:7px;
  left:7px;
  right:7px;
  text-align:center;
  font-size:10px;
  color:#d8d5ff;
  background:#090d1bcc;
  border:1px solid #7770bd66;
  border-radius:6px;
  padding:4px 6px;
}
.info{padding:13px}
.info h3{margin:0 0 9px;font-size:18px}
.tag{
  font-size:12px;
  color:#c2baff;
  background:#28234b;
  padding:5px 8px;
  border-radius:7px;
  display:inline-block;
}
.platform{font-size:12px;color:#9da8c7;margin-left:7px}
 .card p{font-size:13px;color:#aab2c9;line-height:1.45;margin:10px 0 0}
#modal{
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  z-index:10;
  overflow:auto;
  padding:20px;
}
.modalbox{
  max-width:650px;
  margin:25px auto;
  background:#141a30;
  border:1px solid #454b78;
  border-radius:18px;
  padding:22px;
  position:relative;
  box-shadow:0 20px 70px #0008;
}
.close{
  position:absolute;
  right:15px;
  top:15px;
  border:0;
  background:#302d55;
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  cursor:pointer;
  z-index:2;
}
#detailVisual{
  min-height:150px;
  margin:18px 0 12px;
  border-radius:12px;
  overflow:hidden;
  background:linear-gradient(135deg,#242052,#17416b);
  display:flex;
  align-items:center;
  justify-content:center;
}
#detailImage{
  display:none;
  width:100%;
  max-height:250px;
  object-fit:cover;
}
#detailEmoji{font-size:64px;text-align:center;padding:24px}
.modalbox h2{color:#b5aaff;margin:10px 0}
.modalbox p{color:#d0d5e8;line-height:1.6}
#detailTags{color:#a9a4ff}
.small-note{font-size:12px;color:#929dbd!important}
.download{
  display:inline-block;
  background:#6c58e8;
  color:#fff;
  text-decoration:none;
  padding:12px 17px;
  border-radius:9px;
  margin:8px 0 12px;
  font-weight:bold;
}
.download:hover{background:#806df5}
hr{border:0;border-top:1px solid #343c61;margin:18px 0}
textarea{
  width:100%;
  min-height:78px;
  padding:12px;
  resize:vertical;
}
button{cursor:pointer}
#send{
  background:#6c58e8;
  color:#fff;
  border:0;
  padding:10px 16px;
  border-radius:8px;
  margin-top:8px;
}
#send:hover{background:#806df5}
.comment{
  background:#202844;
  padding:10px;
  border-radius:8px;
  margin:8px 0;
  overflow-wrap:anywhere;
  color:#e1e5f4;
}
.empty{
  text-align:center;
  color:#aab2c9;
  grid-column:1/-1;
  padding:35px 10px;
  background:#151b31aa;
  border:1px dashed #454b78;
  border-radius:14px;
}
footer{
  text-align:center;
  color:#7883a5;
  padding:25px 15px 35px;
  font-size:13px;
}
footer .source-note{max-width:850px;margin:9px auto 0;line-height:1.5;color:#697594}
@media(max-width:520px){
  header{padding-top:27px}

  select{min-width:0;width:100%}
  #modal{padding:10px}
  .modalbox{padding:17px;margin:12px auto}
}
</style>
